name: foundation quality

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read


# (the tests start servers through the launcher: never usage reports from CI, telemetry.py)
env:
  BNE_TELEMETRY: "off"

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75     # (every test module but quality_gate.SLOW, 2026-11-10)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - name: Dependencies
        # SciPy is a test-only independent QP reference (PR #814); it is not a server requirement.
        run: python -m pip install --require-hashes -r server/requirements-ci.lock
      - name: OSM tag inventory
        run: python tools/build_taginfo.py --check
      - name: Build required native kernels
        run: python tools/build_native.py
      - name: Foundation regression and package gate
        run: python tools/quality_gate.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: quality-logs-${{ matrix.os }}
          path: build/quality-tests/*.log
          if-no-files-found: warn
